<style>
        .glass-panel {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 40px 80px -20px rgba(0, 31, 63, 0.5);
        }
        .stagger-1 { animation: fadeSlideUp 0.6s ease-out 0.1s both; }
        .stagger-2 { animation: fadeSlideUp 0.6s ease-out 0.2s both; }
        .stagger-3 { animation: fadeSlideUp 0.6s ease-out 0.3s both; }
        .stagger-4 { animation: fadeSlideUp 0.6s ease-out 0.4s both; }
        .stagger-5 { animation: fadeSlideUp 0.6s ease-out 0.5s both; }
        .stagger-6 { animation: fadeSlideUp 0.6s ease-out 0.6s both; }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bg-pan { animation: panBg 40s linear infinite alternate; }
        @keyframes panBg {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
</style>

<body class="bg-background text-on-background min-h-screen font-body-md overflow-x-hidden antialiased flex flex-col">
<main class="flex-grow flex flex-col md:flex-row w-full min-h-screen relative">
<div class="hidden md:block md:w-1/2 relative overflow-hidden bg-primary-container">
<div class="absolute inset-0 bg-cover bg-center bg-pan opacity-60 mix-blend-luminosity" style="background-image: url('hero-bg.jpg'); transform: scale(1.1);"></div>
<div class="absolute inset-0 bg-gradient-to-r from-primary-container/80 to-transparent"></div>
<div class="absolute bottom-16 left-16 right-16 z-10 stagger-1">
<h2 class="font-headline-xl text-headline-xl text-inverse-surface mb-4">NAVIGATE YOUR <br><span class="text-tertiary">FUTURE.</span></h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md">Join the elite ranks of merchant navy professionals. Excellence begins here at Sindhupath.</p>
</div>
</div>
<div class="w-full md:w-1/2 flex items-center justify-center p-5 md:p-16 relative z-10 bg-surface md:bg-transparent">
<div class="md:hidden absolute inset-0 bg-cover bg-center opacity-30" style="background-image: url('hero-bg.jpg');"></div>
<div class="md:hidden absolute inset-0 bg-surface/80 backdrop-blur-xl"></div>
<div class="glass-panel rounded-xl w-full max-w-md p-8 relative z-20">
  <a href="index.html" class="flex items-center gap-1 text-on-surface-variant hover:text-tertiary transition-colors font-body-sm text-body-sm mb-6 group w-fit">
    <span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
    Back to Home
  </a>
<div class="flex flex-col items-center mb-8 stagger-1">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">WELCOME BACK</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Enter your credentials to access the academy.</p>
</div>
<form class="space-y-6">
<div class="relative stagger-2 group">
<input class="peer w-full bg-surface-container-low/50 border border-outline-variant/50 rounded-lg px-4 pt-6 pb-2 font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-tertiary focus:border-tertiary transition-colors" id="email" placeholder=" " required="" type="email">
<label class="absolute left-4 top-4 text-on-surface-variant font-body-sm text-body-sm transition-all peer-focus:-translate-y-3 peer-focus:scale-75 peer-focus:text-tertiary peer-[:not(:placeholder-shown)]:-translate-y-3 peer-[:not(:placeholder-shown)]:scale-75 origin-[0]" for="email">Email Address</label>
</div>
<div class="relative stagger-3 group">
<input class="peer w-full bg-surface-container-low/50 border border-outline-variant/50 rounded-lg px-4 pt-6 pb-2 pr-12 font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-tertiary focus:border-tertiary transition-colors" id="password" placeholder=" " required="" type="password">
<label class="absolute left-4 top-4 text-on-surface-variant font-body-sm text-body-sm transition-all peer-focus:-translate-y-3 peer-focus:scale-75 peer-focus:text-tertiary peer-[:not(:placeholder-shown)]:-translate-y-3 peer-[:not(:placeholder-shown)]:scale-75 origin-[0]" for="password">Password</label>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<div class="flex items-center justify-between stagger-4">
<label class="flex items-center space-x-2 cursor-pointer group">
<input class="form-checkbox h-4 w-4 text-tertiary bg-surface-container-low border-outline-variant rounded focus:ring-tertiary focus:ring-offset-surface" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
<a class="font-body-sm text-body-sm text-tertiary hover:text-tertiary-fixed transition-colors" href="#">Forgot Password?</a>
</div>
<button class="w-full bg-tertiary text-on-tertiary font-label-caps text-label-caps py-4 rounded-lg hover:bg-tertiary-fixed transition-all duration-300 hover:shadow-[0_0_20px_rgba(233,196,0,0.3)] hover:scale-[1.02] stagger-5" type="submit">SIGN IN</button>
</form>
<div class="relative my-8 stagger-6">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant/30"></div></div>
<div class="relative flex justify-center">
<span class="px-4 bg-surface text-on-surface-variant font-label-caps text-label-caps text-[10px] tracking-widest">OR CONTINUE WITH</span>
</div>
</div>
<button class="w-full flex items-center justify-center space-x-3 bg-surface-container-low/30 border border-outline-variant/30 rounded-lg py-3 hover:bg-surface-container-high/50 transition-colors stagger-6" type="button">
<svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-body-sm text-body-sm text-on-surface">Continue with Google</span>
</button>
<div class="mt-8 text-center stagger-6">
<p class="font-body-sm text-body-sm text-on-surface-variant">Don't have an account? <a class="text-tertiary hover:text-tertiary-fixed underline underline-offset-4 decoration-tertiary/30 hover:decoration-tertiary transition-all" href="#">Create one</a></p>
</div>
</div>
</div>
</div>
</main>
<script>
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password');
  if (toggleBtn && passwordInput) {
    toggleBtn.addEventListener('click', () => {
      const icon = toggleBtn.querySelector('.material-symbols-outlined');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        icon.textContent = 'visibility';
      }
    });
  }
</script>
</body></html>
